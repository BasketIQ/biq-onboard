name: Setup self-hosted runner env
description: >-
  Prepares environment variables required by `actions/setup-node` /
  `actions/setup-python` (and other toolcache-aware actions) when running on a
  self-hosted macOS runner that lacks the GitHub-hosted convention path
  `/Users/runner/hostedtoolcache`. Also isolates the job temp dir on any
  self-hosted runner (macOS and Linux): exports TMPDIR/TMP/TEMP pointing at
  $RUNNER_TEMP, which the runner empties at every job boundary — self-hosted
  machines are persistent and the user $TMPDIR is never cleaned. Idempotent +
  no-op on ubuntu-latest. Invoke BEFORE setup-node / setup-python on any job
  whose `runs-on` may resolve to a self-hosted runner.
inputs:
  toolcache_dir:
    description: Toolcache dir on macOS self-hosted. Default $HOME/.runner-cache/toolcache.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare toolcache on macOS self-hosted
      if: runner.os == 'macOS'
      shell: bash
      run: |
        TOOLCACHE_DIR="${{ inputs.toolcache_dir }}"
        if [ -z "$TOOLCACHE_DIR" ]; then
          TOOLCACHE_DIR="$HOME/.runner-cache/toolcache"
        fi
        mkdir -p "$TOOLCACHE_DIR"
        echo "AGENT_TOOLSDIRECTORY=$TOOLCACHE_DIR" >> "$GITHUB_ENV"
        echo "RUNNER_TOOL_CACHE=$TOOLCACHE_DIR" >> "$GITHUB_ENV"
        echo "::notice title=setup-self-hosted-env::macOS toolcache ready at $TOOLCACHE_DIR"

    - name: Isolate job temp dir on self-hosted
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        if [ -z "${RUNNER_TEMP:-}" ]; then
          echo "::warning title=setup-self-hosted-env::RUNNER_TEMP is empty — TMPDIR/TMP/TEMP left untouched"
          exit 0
        fi
        {
          echo "TMPDIR=$RUNNER_TEMP"
          echo "TMP=$RUNNER_TEMP"
          echo "TEMP=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
        echo "::notice title=setup-self-hosted-env::job temp isolated at $RUNNER_TEMP (TMPDIR/TMP/TEMP)"
