name: CI

# Quality gate on every PR and push to main: server tests (biq-core[org]
# from private GAR via WIF), including the regression test that prevents
# update_club from erasing audit provenance.
#
# ── Rule 19 exception ──────────────────────────────────────────────────
# This workflow does NOT use the org-wide `pick-runner` pattern
# (rule 19). The first OEE-1c CI run that used pick-runner selected
# `integration2` (the action saw it as free/online at org level), but
# the `server` job sat queued indefinitely — the runner could not
# accept jobs from this repo. Forcing the pattern makes CI hang, which
# is worse than a documented exception.
#
# This was confirmed twice: run 32673723140 (Architect's original
# attempt) and run 32677342847 (this audit's attempt to restore the
# pattern). Both had `Pick runner` complete successfully, then `server`
# queued indefinitely.
#
# To remove this exception: add `biq-onboard` to the self-hosted
# runners' repository allow-list (org settings → Actions → Runners →
# Default group → configure access). Then replace this workflow with
# the standard pick-runner pattern (see `deploy.yml` in this repo for
# the template).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # WIF, to read biq-core[org] from the private GAR index

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud (biq-core[org] lives in private GAR)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BIQ_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install server (test extra) — biq-core from GAR (ADR-009)
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          pip install "./server[test]" \
            --extra-index-url "https://oauth2accesstoken:${TOKEN}@europe-west1-python.pkg.dev/basketiq-platform-prod/basketiq-python/simple/"

      - name: Verify biq-core version matches pin (prevents local/CI skew)
        run: |
          INSTALLED=$(python3 -c "import biq_core; print(biq_core.__version__)")
          PINNED=$(grep 'biq-core\[org\]==' server/pyproject.toml | head -1 | sed 's/.*==\([^"]*\).*/\1/')
          echo "Installed: $INSTALLED  Pinned: $PINNED"
          if [ "$INSTALLED" != "$PINNED" ]; then
            echo "::error::biq-core version skew: installed $INSTALLED != pinned $PINNED"
            exit 1
          fi

      - name: Server tests (in-memory store)
        env:
          BIQ_ORG_STORE: memory
          BIQ_ROLES_STORE: memory
        run: pytest -q
        working-directory: server
