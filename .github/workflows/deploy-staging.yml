name: Deploy Staging

run-name: deploy staging @ ${{ github.ref_name }}

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - name: Checkout (action only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/pick-runner
          sparse-checkout-cone-mode: false
      - id: runner
        uses: ./.github/actions/pick-runner
        with:
          token: ${{ secrets.RUNNER_PICK_PAT }}
          development_runner_name: ${{ vars.DEVELOPMENT_RUNNER_NAME }}
          integration_runner_name: ${{ vars.INTEGRATION_RUNNER_NAME }}
          integration2_runner_name: ${{ vars.INTEGRATION2_RUNNER_NAME }}
          prefer_development: false
          netdata_token: ${{ secrets.NETDATA_CLOUD_API_TOKEN }}
          netdata_space_id: ${{ vars.NETDATA_CLOUD_SPACE_ID }}
          netdata_room_id: ${{ vars.NETDATA_CLOUD_ROOM_ID }}
          netdata_node_integration2: ${{ vars.NETDATA_NODE_INTEGRATION2 }}
          netdata_node_integration: ${{ vars.NETDATA_NODE_INTEGRATION }}
          netdata_node_development: ${{ vars.NETDATA_NODE_DEVELOPMENT }}

  test:
    needs: [pick]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: false
      - name: Setup self-hosted env (toolcache)
        uses: ./.github/actions/setup-self-hosted-env
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BIQ_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          python3 -m pip install --upgrade pip
          python3 -m pip install "biq-core[org]==0.8.0" \
            --extra-index-url "https://oauth2accesstoken:${TOKEN}@europe-west1-python.pkg.dev/basketiq-platform-prod/basketiq-python/simple/"
          python3 -m pip install -e "./server[firestore,test]"
      - name: Run pytest
        run: python3 -m pytest server/tests -q

  staging:
    needs: [test]
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    secrets: inherit
