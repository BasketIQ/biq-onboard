name: Deploy Staging

run-name: deploy staging @ ${{ github.ref_name }}

# ── Rule 19 exception ──────────────────────────────────────────────────
# This workflow does NOT use the org-wide `pick-runner` pattern
# (rule 19). The pick-runner action selects `integration2` (visible at
# org level), but biq-onboard is not in the self-hosted runner group's
# repository allow-list, so the `test` job sits queued indefinitely.
# Same issue documented in ci.yml. To remove this exception: add
# biq-onboard to the self-hosted runners' repository allow-list (org
# settings → Actions → Runners → Default group → configure access).

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          persist-credentials: false
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BIQ_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          python3 -m pip install --upgrade pip
          # Version comes from server/pyproject.toml (single source of truth).
          BIQ_CORE_VERSION=$(grep 'biq-core\[org\]==' server/pyproject.toml | head -1 | sed 's/.*==\([^"]*\).*/\1/')
          python3 -m pip install "biq-core[org]==${BIQ_CORE_VERSION}" \
            --extra-index-url "https://oauth2accesstoken:${TOKEN}@europe-west1-python.pkg.dev/basketiq-platform-prod/basketiq-python/simple/"
          python3 -m pip install -e "./server[firestore,test]"
      - name: Run pytest
        run: python3 -m pytest server/tests -q

  staging:
    needs: [test]
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    secrets: inherit
