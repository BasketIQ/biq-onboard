name: Deploy Staging

run-name: deploy staging @ ${{ github.ref_name }}

# ── Rule 19 exception ──────────────────────────────────────────────────
# This workflow does NOT use the org-wide `pick-runner` pattern
# (rule 19). The pick-runner action selects `integration2` (visible at
# org level), but biq-onboard is not in the self-hosted runner group's
# repository allow-list, so the `test` job sits queued indefinitely.
# Same issue documented in ci.yml. To remove this exception: add
# biq-onboard to the self-hosted runners' repository allow-list (org
# settings → Actions → Runners → Default group → configure access).

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  pick:
    name: Pick runner
    runs-on: [self-hosted, development]
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - name: Checkout (action only)
        uses: actions/checkout@v4
      - id: runner
        uses: ./.github/actions/pick-runner
        with:
          token: ${{ secrets.RUNNER_PICK_PAT }}
          development_runner_name: ${{ vars.DEVELOPMENT_RUNNER_NAME }}
          integration_runner_name: ${{ vars.INTEGRATION_RUNNER_NAME }}
          integration2_runner_name: ${{ vars.INTEGRATION2_RUNNER_NAME }}

  test:
    needs: [pick]
    runs-on: ${{ needs.pick.outputs.runner == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON(format('["self-hosted","{0}"]', needs.pick.outputs.runner)) }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup self-hosted env
        uses: ./.github/actions/setup-self-hosted-env

      - name: Authenticate to Google Cloud (GAR token only — no ADC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BIQ_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server dependencies
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          python3 -m pip install --upgrade pip
          # Version comes from server/pyproject.toml (single source of truth).
          BIQ_CORE_VERSION=$(grep 'biq-core\[org\]==' server/pyproject.toml | head -1 | sed 's/.*==\([^"]*\).*/\1/')
          python3 -m pip install "biq-core[org]==${BIQ_CORE_VERSION}" \
            --extra-index-url "https://oauth2accesstoken:${TOKEN}@europe-west1-python.pkg.dev/basketiq-platform-prod/basketiq-python/simple/"
          python3 -m pip install -e "./server[firestore,test]"
      - name: Run pytest
        run: python3 -m pytest server/tests -q
      - name: CI AI guard (rule 10)
        # -q hides test ids; this run makes the guard's execution visible.
        run: python3 -m pytest -q -rA server/tests/test_ci_ai_guard.py

  staging:
    needs: [test]
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
