name: deploy

# Reusable deploy engine (ADR-007 pattern, same as biq-methodology).

run-name: "deploy ${{ inputs.env }} @ ${{ inputs.ref || 'main' }}"

on:
  workflow_call:
    inputs:
      env:
        description: "Target environment (staging|production)"
        required: true
        type: string
      ref:
        description: "Ref to deploy"
        required: false
        type: string
        default: main
      candidate_pr:
        description: "Internal PR with successful exact-head CI. Staging only, no traffic."
        type: string
        default: ""
      confirm:
        description: "Must equal DEPLOY-PRODUCTION when env=production."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Ref to deploy"
        required: false
        type: string
        default: main
      candidate_pr:
        description: "Internal PR with successful exact-head CI. Staging only, no traffic."
        type: string
        default: ""
      confirm:
        description: "Must equal DEPLOY-PRODUCTION when env=production."
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-${{ inputs.env }}-biq-onboard
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
  deployments: write

jobs:
  pick:
    name: Pick runner
    runs-on: [self-hosted, pick]
    outputs:
      runner: ${{ steps.runner.outputs.runner }}
      heavy: ${{ steps.runner.outputs.runner_heavy }}
      light: ${{ steps.runner.outputs.runner_light }}
      deploy: ${{ steps.runner.outputs.runner_deploy }}
    steps:
      - name: Checkout (action only)
        uses: actions/checkout@v4
      - id: runner
        uses: ./.github/actions/pick-runner
        with:
          token: ${{ secrets.RUNNER_PICK_PAT }}
          development_runner_name: ${{ vars.DEVELOPMENT_RUNNER_NAME }}
          integration_runner_name: ${{ vars.INTEGRATION_RUNNER_NAME }}
          integration2_runner_name: ${{ vars.INTEGRATION2_RUNNER_NAME }}

  deploy-staging:
    needs: [pick]
    runs-on: ${{ needs.pick.outputs.deploy == 'ubuntu-latest' && fromJSON('["ubuntu-latest"]') || fromJSON(format('["self-hosted","{0}"]', needs.pick.outputs.deploy)) }}
    environment: ${{ inputs.env }}
    timeout-minutes: 20
    steps:
      - name: Guard environment (production gated — rule 02)
        run: |
          ENV="${{ inputs.env }}"
          case "$ENV" in
            staging) ;;
            production)
              if [ "${{ inputs.confirm }}" != "DEPLOY-PRODUCTION" ]; then
                echo "::error::Refusing production deploy without confirm=DEPLOY-PRODUCTION (rule 02)."
                exit 1
              fi ;;
            *)
              echo "::error::unknown env '$ENV' (want staging|production)"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Setup self-hosted env (toolcache)
        uses: ./.github/actions/setup-self-hosted-env

      - name: Ensure gh on PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Verify checkout provenance and exact CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref || 'main' }}
          TARGET_ENV: ${{ inputs.env }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}" >> "$GITHUB_ENV"
          if [ -n "$CANDIDATE_PR" ]; then
            test "$TARGET_ENV" = staging
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$CANDIDATE_PR" =~ ^[1-9][0-9]{0,8}$ ]]
            [[ "$REQUESTED_REF" =~ ^[a-f0-9]{40}$ ]]
            test "$CHECKED_OUT_SHA" = "$REQUESTED_REF"
            pr="$(gh api "repos/${GH_REPO}/pulls/${CANDIDATE_PR}")"
            jq -e --arg sha "$CHECKED_OUT_SHA" --arg repo "$GH_REPO" \
              '.state == "open" and .base.ref == "main" and .head.sha == $sha
               and (.head.repo.full_name | ascii_downcase) == ($repo | ascii_downcase)' <<< "$pr" >/dev/null
            head_branch="$(jq -er .head.ref <<< "$pr")"
            test "$GITHUB_REF" = "refs/heads/$head_branch"
            RUN_ID="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${CHECKED_OUT_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$CHECKED_OUT_SHA"'" and .event == "pull_request")] | sort_by(.created_at) | last | .id // empty')"
            test -n "$RUN_ID"
            gh run watch "$RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
            echo "CANDIDATE_TAG=pr-${CANDIDATE_PR}-${CHECKED_OUT_SHA:0:7}" >> "$GITHUB_ENV"
          elif [ "$TARGET_ENV" = staging ]; then
            [[ "$REQUESTED_REF" = main || "$REQUESTED_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
            test "$GITHUB_REF" = refs/heads/main
            EXPECTED_SHA="$(gh api "repos/${GH_REPO}/commits/${REQUESTED_REF}" --jq .sha)"
            test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
            RUN_ID="$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=${CHECKED_OUT_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"$CHECKED_OUT_SHA"'" and .head_branch == "main" and .event == "push")] | sort_by(.created_at) | last | .id // empty')"
            test -n "$RUN_ID"
            gh run watch "$RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BIQ_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare numeric identity callback references
        env:
          TARGET_ENV: ${{ inputs.env }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          CALLBACK_SECRET_VERSION: ${{ vars.BIQ_THEME_JOB_RESULT_TOKEN_VERSION }}
          EMBED_SECRET_VERSION: ${{ vars.BIQ_EMBED_JWT_SECRET_VERSION }}
        run: |
          set -euo pipefail
          bash scripts/identity_runtime_secrets.sh >> "$GITHUB_ENV"
          if [ "$TARGET_ENV" = staging ]; then
            for spec in "BIQ_THEME_JOB_RESULT_TOKEN:${CALLBACK_SECRET_VERSION}" "BIQ_EMBED_JWT_SECRET:${EMBED_SECRET_VERSION}"; do
              STATE="$(gcloud secrets versions describe "${spec#*:}" --secret="${spec%:*}" --project="$PROJECT_ID" --format='value(state)')"
              test "$STATE" = ENABLED
            done
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prefetch biq-core wheelhouse from GAR (ADR-009)
        run: |
          rm -rf wheelhouse && mkdir -p wheelhouse
          TOKEN="$(gcloud auth print-access-token)"
          # Version comes from server/pyproject.toml (single source of truth).
          BIQ_CORE_VERSION=$(grep 'biq-core\[org\]==' server/pyproject.toml | head -1 | sed 's/.*==\([^"]*\).*/\1/')
          PIP_EXTRA_INDEX_URL="https://oauth2accesstoken:${TOKEN}@europe-west1-python.pkg.dev/basketiq-platform-prod/basketiq-python/simple/" \
          python3 -m pip download "biq-core[org]==${BIQ_CORE_VERSION}" \
            --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --python-version 312 \
            -d wheelhouse
          echo "wheelhouse: $(ls wheelhouse | wc -l) wheels"

      - name: Install gcloud beta component
        run: gcloud components install beta -q --no-user-output-enabled

      - name: Build container with Cloud Build
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          AR_REPO: ${{ vars.GCP_AR_REPO }}
          RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
        run: |
          IMAGE_URI="europe-west1-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${RUN_SERVICE}:${CHECKED_OUT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          BUILD_ID=$(gcloud builds submit . \
            --project "${PROJECT_ID}" \
            --config cloudbuild.yaml \
            --substitutions=_IMAGE="${IMAGE_URI}" \
            --async --format='value(id)')
          echo "BUILD_ID=${BUILD_ID}" >> "${GITHUB_ENV}"
          gcloud beta builds log "${BUILD_ID}" --project "${PROJECT_ID}" --stream --quiet
          gcloud builds describe "${BUILD_ID}" --project "${PROJECT_ID}" --format='value(status)' | grep -q '^SUCCESS$'
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}" --project "${PROJECT_ID}" --format='value(image_summary.digest)')"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "DEPLOY_IMAGE=${IMAGE_URI%:*}@${IMAGE_DIGEST}" >> "$GITHUB_ENV"

      - name: Verify dedicated task-invoker SA (C5/R1)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # R1: Fail-closed verification of the dedicated task-invoker SA.
          # The SA must be provisioned via the governed IAM path (console/terraform).
          # The deployer SA typically lacks iam.serviceAccounts.create — that is
          # expected. This step verifies the SA EXISTS and has the required binding.
          # No best-effort: if the SA doesn't exist or binding is missing, fail.
          TASK_INVOKER_SA="biq-task-invoker@${PROJECT_ID}.iam.gserviceaccount.com"
          echo "TASK_INVOKER_SA=${TASK_INVOKER_SA}" >> "${GITHUB_ENV}"

          # R1: Verify SA exists — fail closed if not
          if ! gcloud iam service-accounts describe "${TASK_INVOKER_SA}" --project "${PROJECT_ID}" >/dev/null 2>&1; then
            echo "::error::Dedicated task-invoker SA does not exist: ${TASK_INVOKER_SA}"
            echo "::error::Provision it via the governed IAM path (console/terraform) with:"
            echo "::error::  roles/run.jobsExecutorWithOverrides on club-theme-generation Cloud Run Job"
            echo "::error::  roles/iam.serviceAccountTokenCreator for Cloud Tasks service agent"
            exit 1
          fi
          echo "Verified: task-invoker SA exists: ${TASK_INVOKER_SA}"

          # R1: Verify the SA has run.jobs.run on the club-theme-generation job
          JOB_NAME="club-theme-generation"
          JOB_LOCATION="europe-west1"
          POLICY=$(gcloud run jobs get-iam-policy "${JOB_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${JOB_LOCATION}" \
            --format="json(bindings)" 2>/dev/null || echo '{"bindings":[]}')

          if echo "${POLICY}" | jq -e --arg sa "serviceAccount:${TASK_INVOKER_SA}" \
            '.bindings[]? | select(.role=="roles/run.jobsExecutorWithOverrides") | .members[]? | select(.==$sa)' >/dev/null 2>&1; then
            echo "Verified: ${TASK_INVOKER_SA} has roles/run.jobsExecutorWithOverrides on ${JOB_NAME}"
          else
            echo "::error::${TASK_INVOKER_SA} is missing roles/run.jobsExecutorWithOverrides on ${JOB_NAME}"
            echo "::error::Grant the binding via: gcloud run jobs add-iam-policy-binding ${JOB_NAME} --region ${JOB_LOCATION} --member serviceAccount:${TASK_INVOKER_SA} --role roles/run.jobsExecutorWithOverrides"
            exit 1
          fi

          echo "Dedicated task-invoker SA name: ${TASK_INVOKER_SA}"

          # V1: Verify Cloud Tasks service agent has tokenCreator on the invoker SA
          PROJECT_NUM=$(gcloud projects describe "${PROJECT_ID}" --format="value(projectNumber)" 2>/dev/null || echo "")
          CT_SA="service-${PROJECT_NUM}@gcp-sa-cloudtasks.iam.gserviceaccount.com"
          SA_POLICY=$(gcloud iam service-accounts get-iam-policy "${TASK_INVOKER_SA}" --project "${PROJECT_ID}" --format="json" 2>/dev/null || echo "{}")
          if echo "${SA_POLICY}" | jq -e --arg ct_sa "serviceAccount:${CT_SA}" \
            '.bindings[]? | select(.role=="roles/iam.serviceAccountTokenCreator") | .members[]? | select(.==$ct_sa)' >/dev/null 2>&1; then
            echo "Verified: Cloud Tasks SA (${CT_SA}) has roles/iam.serviceAccountTokenCreator on ${TASK_INVOKER_SA}"
          else
            echo "::error::Cloud Tasks SA (${CT_SA}) is missing roles/iam.serviceAccountTokenCreator on ${TASK_INVOKER_SA}"
            echo "::error::Grant via: gcloud iam service-accounts add-iam-policy-binding ${TASK_INVOKER_SA} --project ${PROJECT_ID} --member serviceAccount:${CT_SA} --role roles/iam.serviceAccountTokenCreator"
            exit 1
          fi

      - name: Verify runtime SA can enqueue tasks and impersonate invoker (F5)
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          # F5: The Cloud Run revision's runtime SA (default compute SA) needs
          # two permissions to enqueue Cloud Tasks that target a Cloud Run Job
          # via OAuthToken impersonation:
          #   1. cloudtasks.tasks.create on the queue (roles/cloudtasks.enqueuer)
          #   2. iam.serviceAccounts.actAs on the task-invoker SA (roles/iam.serviceAccountUser)
          # Without these, _enqueue_generation_task() raises 403 and theme
          # generation fails with "enqueue failed: 403 ...".
          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)' 2>/dev/null || echo "")
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          TASK_INVOKER_SA="${TASK_INVOKER_SA}"
          QUEUE_LOCATION="europe-west1"
          QUEUE_NAME="club-theme-generation"

          # 1. Verify runtime SA has cloudtasks.enqueuer — check BOTH project
          #    level and queue level. The binding can be granted at either scope;
          #    checking only project-level produces a false negative when the
          #    binding was granted via `gcloud tasks queues add-iam-policy-binding`
          #    (queue-level), which is the more precise and recommended scope.
          SA_MEMBER="serviceAccount:${RUNTIME_SA}"
          ENQUEUER_OK=false

          # 1a. Check project-level binding
          PROJECT_POLICY=$(gcloud projects get-iam-policy "${PROJECT_ID}" --format="json(bindings)" 2>/dev/null || echo '{"bindings":[]}')
          if echo "${PROJECT_POLICY}" | jq -e --arg sa "${SA_MEMBER}" \
            '.bindings[]? | select(.role=="roles/cloudtasks.enqueuer") | .members[]? | select(.==$sa)' >/dev/null 2>&1; then
            echo "Verified: ${RUNTIME_SA} has roles/cloudtasks.enqueuer on ${PROJECT_ID} (project-level)"
            ENQUEUER_OK=true
          fi

          # 1b. Check queue-level binding (only if project-level check failed)
          if [ "${ENQUEUER_OK}" = "false" ]; then
            QUEUE_POLICY=$(gcloud tasks queues get-iam-policy "${QUEUE_NAME}" --location="${QUEUE_LOCATION}" --project="${PROJECT_ID}" --format="json(bindings)" 2>/dev/null || echo '{"bindings":[]}')
            if echo "${QUEUE_POLICY}" | jq -e --arg sa "${SA_MEMBER}" \
              '.bindings[]? | select(.role=="roles/cloudtasks.enqueuer") | .members[]? | select(.==$sa)' >/dev/null 2>&1; then
              echo "Verified: ${RUNTIME_SA} has roles/cloudtasks.enqueuer on ${QUEUE_NAME} (queue-level)"
              ENQUEUER_OK=true
            fi
          fi

          if [ "${ENQUEUER_OK}" = "false" ]; then
            echo "::error::Runtime SA (${RUNTIME_SA}) is missing roles/cloudtasks.enqueuer on ${PROJECT_ID}"
            echo "::error::Grant at project level:  gcloud projects add-iam-policy-binding ${PROJECT_ID} --member ${SA_MEMBER} --role roles/cloudtasks.enqueuer"
            echo "::error::Or grant at queue level:  gcloud tasks queues add-iam-policy-binding ${QUEUE_NAME} --location ${QUEUE_LOCATION} --project ${PROJECT_ID} --member ${SA_MEMBER} --role roles/cloudtasks.enqueuer"
            exit 1
          fi

          # 2. Verify runtime SA has iam.serviceAccountUser on the task-invoker SA
          SA_POLICY=$(gcloud iam service-accounts get-iam-policy "${TASK_INVOKER_SA}" --project "${PROJECT_ID}" --format="json(bindings)" 2>/dev/null || echo '{"bindings":[]}')
          if echo "${SA_POLICY}" | jq -e --arg sa "serviceAccount:${RUNTIME_SA}" \
            '.bindings[]? | select(.role=="roles/iam.serviceAccountUser") | .members[]? | select(.==$sa)' >/dev/null 2>&1; then
            echo "Verified: ${RUNTIME_SA} has roles/iam.serviceAccountUser on ${TASK_INVOKER_SA}"
          else
            echo "::error::Runtime SA (${RUNTIME_SA}) is missing roles/iam.serviceAccountUser on ${TASK_INVOKER_SA}"
            echo "::error::Grant via: gcloud iam service-accounts add-iam-policy-binding ${TASK_INVOKER_SA} --project ${PROJECT_ID} --member serviceAccount:${RUNTIME_SA} --role roles/iam.serviceAccountUser"
            exit 1
          fi

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
          # Numeric Secret Manager version the service pins BIQ_INTERNAL_TOKEN
          # to — the approved mesh pin, never :latest (biq-app deploy.yml
          # carries the same contract; a floating ref silently splits the
          # mesh on rotation). Required per GitHub Environment.
          INTERNAL_TOKEN_VERSION: ${{ vars.BIQ_INTERNAL_TOKEN_VERSION }}
        run: |
          # C14: Fail-closed — validate all required env vars are non-empty
          # before deploying. Missing config must not produce a silently
          # broken deployment.
          REQUIRED_VARS=(
            "BIQ_ONBOARD_S2S_SECRET=${{ secrets.BIQ_ONBOARD_S2S_SECRET }}"
            "BIQ_ONBOARD_CALLBACK_URL=${{ vars.BIQ_ONBOARD_CALLBACK_URL }}"
            "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"
          )
          LEGACY_CALLBACK_ENV=""
          if [ "${{ inputs.env }}" != staging ]; then
            REQUIRED_VARS+=("BIQ_THEME_JOB_RESULT_TOKEN=${{ secrets.BIQ_THEME_JOB_RESULT_TOKEN }}")
            LEGACY_CALLBACK_ENV=",BIQ_THEME_JOB_RESULT_TOKEN=${{ secrets.BIQ_THEME_JOB_RESULT_TOKEN }}"
          fi
          for var_pair in "${REQUIRED_VARS[@]}"; do
            var_name="${var_pair%%=*}"
            var_value="${var_pair#*=}"
            if [ -z "${var_value}" ]; then
              echo "::error::Required config '${var_name}' is empty — refusing to deploy (C14 fail-closed)"
              exit 1
            fi
          done
          echo "All required config values present (C14 fail-closed check passed)"

          PROJECT_NUMBER=$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')
          DEFAULT_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"

          # C5: Use the dedicated task-invoker SA, not the deployer SA
          TASK_INVOKER_SA="${TASK_INVOKER_SA}"

          # R9: BIQ_INTERNAL_TOKEN mounts at the EXPLICIT numeric version
          # configured for this environment — never :latest. Reject
          # nonnumeric values before any Secret Manager lookup ("latest"
          # resolves ENABLED and would silently recreate the split).
          test -n "${INTERNAL_TOKEN_VERSION}" \
            || { echo "::error::BIQ_INTERNAL_TOKEN_VERSION is not configured for this environment — refusing to deploy without an explicit token pin"; exit 1; }
          case "${INTERNAL_TOKEN_VERSION}" in
            *[!0-9]*|'')
              echo "::error::BIQ_INTERNAL_TOKEN_VERSION must be a numeric Secret Manager version, got '${INTERNAL_TOKEN_VERSION}' — refusing to deploy"
              exit 1 ;;
          esac
          # || true: a missing secret makes gcloud exit non-zero; under
          # `bash -e` a failing command substitution aborts the script
          # silently, before the explicit ::error:: guard below can run.
          TOKEN_VERSION_STATE="$(gcloud secrets versions describe "${INTERNAL_TOKEN_VERSION}" \
            --secret=BIQ_INTERNAL_TOKEN --project="${PROJECT_ID}" --format='value(state)' 2>/dev/null || true)"
          test "${TOKEN_VERSION_STATE}" = "ENABLED" \
            || { echo "::error::BIQ_INTERNAL_TOKEN version ${INTERNAL_TOKEN_VERSION} is ${TOKEN_VERSION_STATE:-unreadable} — refusing to deploy"; exit 1; }

          # R9: BIQ_EMBED_JWT_SECRET — the shared HS256 signing secret for
          # App-issued entry proofs (entry_proof.py). Mounted from Secret
          # Manager so the value never transits logs or env diffs; the
          # canonical config owner distributes it (basketiq-wow cfg). Fail
          # closed on metadata: without it every entry proof is rejected.
          EMBED_VERSION_STATE="$(gcloud secrets versions list "BIQ_EMBED_JWT_SECRET" \
            --project "${PROJECT_ID}" \
            --filter='state=ENABLED' --limit=1 --format='value(state)' 2>/dev/null || true)"
          test -n "${EMBED_VERSION_STATE}" \
            || { echo "::error::BIQ_EMBED_JWT_SECRET has no enabled Secret Manager version — refusing to deploy (entry proofs would fail closed)"; exit 1; }

          candidate_flags=()
          if [ -n "${CANDIDATE_TAG:-}" ]; then
            gcloud run services describe "${RUN_SERVICE}" --project "${PROJECT_ID}" \
              --region europe-west1 --format='json(status.traffic)' > "$RUNNER_TEMP/methodology-before.json"
            candidate_flags=(--no-traffic --tag "${CANDIDATE_TAG}")
          fi
          gcloud run deploy "${RUN_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region europe-west1 \
            --platform managed \
            --image "${DEPLOY_IMAGE}" \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "BIQ_ENV=prod,BIQ_ORG_STORE=firestore,BIQ_ROLES_STORE=firestore,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},BIQ_ONBOARD_USER=${{ secrets.BIQ_ONBOARD_USER }},BIQ_ONBOARD_PASSWORD=${{ secrets.BIQ_ONBOARD_PASSWORD }},BIQ_ONBOARD_SESSION_SECRET=${{ secrets.BIQ_ONBOARD_SESSION_SECRET }},BIQ_ONBOARD_S2S_SECRET=${{ secrets.BIQ_ONBOARD_S2S_SECRET }}${LEGACY_CALLBACK_ENV},BIQ_CLOUD_TASKS_QUEUE=club-theme-generation,GCP_TASKS_QUEUE=club-theme-generation,GCP_TASKS_LOCATION=europe-west1,GCP_THEME_JOB_NAME=club-theme-generation,GCP_TASK_INVOKER_SA=${TASK_INVOKER_SA},BIQ_ONBOARD_CALLBACK_URL=${{ vars.BIQ_ONBOARD_CALLBACK_URL }},BIQ_METHODOLOGY_URL=https://biq-methodology-staging-859603579451.europe-west1.run.app,BIQ_SEASON_PLAN_URL=https://biq-season-plan-staging-859603579451.europe-west1.run.app,BIQ_APP_URL=https://biq-app-staging-859603579451.europe-west1.run.app" \
            --set-secrets "BIQ_INTERNAL_TOKEN=BIQ_INTERNAL_TOKEN:${INTERNAL_TOKEN_VERSION},BIQ_EMBED_JWT_SECRET=BIQ_EMBED_JWT_SECRET:${PINNED_EMBED_VERSION}${CALLBACK_SECRET_MAPPING}" \
            --service-account "${DEFAULT_SA}" "${candidate_flags[@]}"

      - name: Health check
        env:
          TARGET_ENV: ${{ inputs.env }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
        run: |
          URL=$(gcloud run services describe "${RUN_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region europe-west1 \
            --format='value(status.url)')
          if [ -n "${CANDIDATE_TAG:-}" ]; then
            route="$(gcloud run services describe "${RUN_SERVICE}" --project "${PROJECT_ID}" \
              --region europe-west1 --format='json(status.traffic)')"
            served='.status.traffic | map(select((.percent // 0) > 0) | {revisionName, percent}) | sort_by(.revisionName)'
            test "$(jq -c "$served" "$RUNNER_TEMP/methodology-before.json")" = "$(jq -c "$served" <<< "$route")"
            URL="$(jq -er --arg tag "${CANDIDATE_TAG}" \
              '.status.traffic[] | select(.tag == $tag and (.percent // 0) == 0) | .url' <<< "$route")"
            echo "Candidate revision URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$TARGET_ENV" = staging ]; then
            # After a preview, Cloud Run can retain its pin to the old revision.
            revision="$(gcloud run services describe "${RUN_SERVICE}" --project "${PROJECT_ID}" \
              --region europe-west1 --format='value(status.latestCreatedRevisionName)')"
            image="$(gcloud run revisions describe "$revision" --project "${PROJECT_ID}" \
              --region europe-west1 --format='value(status.imageDigest)')"
            test "$image" = "$DEPLOY_IMAGE"
            gcloud run services update-traffic "${RUN_SERVICE}" --project "${PROJECT_ID}" \
              --region europe-west1 --to-revisions "$revision=100"
            serving="$(gcloud run services describe "${RUN_SERVICE}" --project "${PROJECT_ID}" \
              --region europe-west1 --format='json(status.traffic)')"
            jq -e --arg revision "$revision" \
              '[.status.traffic[] | select((.percent // 0) > 0)] as $live
               | ($live | length) == 1 and $live[0].percent == 100 and $live[0].revisionName == $revision' \
              <<< "$serving" >/dev/null
          fi
          echo "SERVICE_URL=${URL}" >> "${GITHUB_ENV}"
          for i in 1 2 3 4 5; do
            echo "Health check attempt ${i}..."
            HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/health.out "${URL}/health" || echo "000")
            echo "HTTP ${HTTP_CODE}"
            [ "${HTTP_CODE}" = "200" ] && exit 0
            cat /tmp/health.out || true
            sleep 10
          done
          exit 1
