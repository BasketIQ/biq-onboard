[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biq-onboard-server"
version = "0.1.0"
description = "BasketIQ Club Onboarding & Org Management service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
    "biq-core[org]==0.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "httpx>=0.27.0"]
firestore = ["google-cloud-firestore>=2.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
